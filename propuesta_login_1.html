<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="libraries/bootstrap-4.6.2-dist/css/bootstrap-grid.min.css"> -->
    <link rel="stylesheet" href="libraries/fontawesome-free-6.7.2-web/css/all.min.css">

    <style>
        @import url("https://fonts.googleapis.com/css?family=Nunito:400,600,700");

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Nunito", sans-serif;
            color: rgba(0, 0, 0, 0.7);
        }

        .container {
            /* height: 100vh; */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: url(fondo_login_propuesta_1.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .modal {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: rgba(51, 51, 51, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.4s;
        }

        .modal-container {
            display: flex;
            max-width: 720px;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            position: absolute;
            opacity: 0;
            pointer-events: none;
            transition-duration: 0.3s;
            background: #fff;
            transform: translateY(100px) scale(0.4);
        }

        .modal-title {
            font-size: 26px;
            margin: 0;
            font-weight: 400;
            color: #55311c;
        }

        .modal-desc {
            margin: 6px 0 30px 0;
        }

        .modal-left {
            padding: 60px 30px 20px;
            background: #fff;
            flex: 1.5;
            transition-duration: 0.5s;
            transform: translateY(80px);
            opacity: 0;
        }

        .modal-button {
            color: #7a6458;
            font-family: "Nunito", sans-serif;
            font-size: 18px;
            cursor: pointer;
            border: 0;
            outline: 0;
            padding: 10px 40px;
            border-radius: 30px;
            background: rgb(255, 255, 255);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.16);
            transition: 0.3s;
        }

        .modal-button:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.8);
        }

        .modal-right {
            flex: 2;
            font-size: 0;
            transition: 0.3s;
            overflow: hidden;
        }

        .modal-right img {
            width: 100%;
            height: 100%;
            transform: scale(2);
            object-fit: cover;
            transition-duration: 1.2s;
        }

        .modal.is-open {
            height: 100%;
            background: rgba(51, 51, 51, 0.85);
        }

        .modal.is-open .modal-button {
            opacity: 0;
        }

        .modal.is-open .modal-container {
            opacity: 1;
            transition-duration: 0.6s;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .modal.is-open .modal-right img {
            transform: scale(1);
        }

        .modal.is-open .modal-left {
            transform: translateY(0);
            opacity: 1;
            transition-delay: 0.1s;
        }

        .modal-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-buttons a {
            color: rgba(34, 154, 228, 0.8);
            font-size: 14px;
        }

        .sign-up {
            margin: 60px 0 0;
            font-size: 14px;
            text-align: center;
        }

        .sign-up a {
            color: #8c7569;
        }

        .input-button {
            padding: 8px 12px;
            outline: none;
            border: 0;
            color: #fff;
            border-radius: 4px;
            background: #3E7CB1;
            font-family: "Nunito", sans-serif;
            transition: 0.3s;
            cursor: pointer;
        }

        .input-button:hover {
            background: #0D3D7D;
        }

        .input-label {
            font-size: 11px;
            text-transform: uppercase;
            font-family: "Nunito", sans-serif;
            font-weight: 600;
            letter-spacing: 0.7px;
            color: #8c7569;
            transition: 0.3s;
        }

        .input-block {
            display: flex;
            flex-direction: column;
            padding: 10px 10px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .input-block input {
            outline: 0;
            border: 0;
            padding: 4px 0 0;
            font-size: 14px;
            font-family: "Nunito", sans-serif;
        }

        .input-block input::placeholder {
            color: #ccc;
            opacity: 1;
        }

        .input-block:focus-within {
            border-color: #7490cc;
        }

        .input-block:focus-within .input-label {
            color: rgba(116, 114, 204, 1);
        }

        .icon-button {
            outline: 0;
            position: absolute;
            right: 10px;
            top: 12px;
            width: 32px;
            height: 32px;
            border: 0;
            background: 0;
            padding: 0;
            cursor: pointer;
        }

        .scroll-down {
            position: fixed;
            top: 50%;
            left: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: #0D3D7D;
            font-size: 32px;
            font-weight: 800;
            transform: translate(-50%, -50%);
        }

        .scroll-down svg {
            margin-top: 16px;
            width: 52px;
            fill: currentColor;
        }

        @media (max-width: 750px) {
            .modal-container {
                width: 90%;
            }

            .modal-right {
                display: none;
            }
        }

        .logo-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            /* Espacio entre logo y texto */
            margin: 10px 0 30px;
        }

        .logo-title p {
            margin: 0;
            display: flex;
            align-items: center;
        }

        .logo-title img {
            width: 60px;
            /* Ajusta el tamaño del logo */
            height: auto;
            display: block;
        }

        html,
        body {
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>

    <div class="container"></div>
    <div class="modal">
        <div class="modal-container">
            <div class="modal-left">
                <h1 class="modal-title">¡Bienvenido!</h1>
                <div class="logo-title">
                    <img src="images/diavaz.png">
                    <p class="modal-desc">Telemetria Diavaz Servicios de Producción.</p>
                </div>

                <div class="input-block">
                    <label for="email" class="input-label">Correo</label>
                    <input type="email" name="email" id="email" placeholder="Ej. correo@dominio.com" autocomplete="off">
                </div>
                <div class="input-block">
                    <label for="password" class="input-label">Contraseña</label>
                    <input type="password" name="password" id="password" placeholder="">
                </div>
                <div class="modal-buttons">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                    <button class="input-button">Iniciar sesión</button>
                </div>
                <p class="sign-up">Diavaz servicios de producción terrestres Telemetría</p>
            </div>
            <div class="modal-right">
                <img src="img_propuesta_login_1_1.png" alt="">
            </div>
            <button class="icon-button close-button"><i class="fa-regular fa-2xl fa-circle-xmark"
                    style="color: #ffffff;"></i></button>
        </div>
        <button class="modal-button">Iniciar sesión</button>
    </div>

    <script>
        const body = document.querySelector("body");
        const modal = document.querySelector(".modal");
        const modalButton = document.querySelector(".modal-button");
        const closeButton = document.querySelector(".close-button");
        const scrollDown = document.querySelector(".scroll-down");
        let isOpened = false;

        const openModal = () => {
            modal.classList.add("is-open");
            body.style.overflow = "hidden";
        };

        const closeModal = () => {
            modal.classList.remove("is-open");
            body.style.overflow = "initial";
        };

        modalButton.addEventListener("click", openModal);
        closeButton.addEventListener("click", closeModal);

        document.onkeydown = evt => {
            evt = evt || window.event;
            evt.keyCode === 27 ? closeModal() : false;
        };
        setTimeout(() => {
            openModal();
        }, 200);


    </script>
</body>


</html>
