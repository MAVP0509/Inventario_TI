<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecimineto de contraseña</title>

    <link rel="stylesheet" href="libraries/bootstrap-4.6.2-dist/css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="libraries/fontawesome-free-6.7.2-web/css/all.min.css">
</head>
<body class="container-fluid d-flex justify-content-center align-items-center vh-100" onload="load()" >
    
        <div class="card text-center" style="width: 50vh;" id="form-resetPass" >
            <div class="card-body">
                <h5>Resestablece tu contraseña</h5>
                <i class="fa-solid fa-user-secret fa-5x"></i><br><br>
                <div class="input-group mb-3">
                    <div class="input-group-prepend">
                        <span class="input-group-text" id="mostrar-pass"><i class="fa-solid fa-eye-slash" style="cursor: pointer;"></i></span>
                    </div>
                    <input type="password" class="form-control respasscomprobar" id="respass" data-html="true" data-toggle="popover" data-trigger="hover" title="Crea una contraseña segura"
                    data-content="<ul class='list-group'>
                                    <li class='list-group-item' id='mnlong'>Que tenga al menos 8 caracteres.</li>
                                    <li class='list-group-item' id='mymlet'>Que incluya letras mayúsculas y minúsculas.</li>
                                    <li class='list-group-item' id='mnlet'>Que incluya números.</li>
                                    <li class='list-group-item' id='mincrc'>Que incluya caracteres especiales como * () # @, etc.</li>
                                </ul>"
                    placeholder="Nueva contraseña" name="inputReset">
                </div>
                <div class="input-group mb-3">
                    <div class="input-group-prepend">
                        <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                    </div>
                    <input type="password" class="form-control" id="conf-respass" placeholder="Confirmar contraseña" name="inputReset">
                </div>
                <div class="form-group">
                    <button type="button" class="btn btn-primary" onclick="confirmarReset()">Confirmar</button>
                </div>
                <div id="mensaje-error" style="display: none; color: red;"></div>

            </div>
        </div>    
        
        <!--Código del toast-->
        <div aria-live="polite" aria-atomic="true" style="position: relative; min-height: 200px; ">
            <div class="position-fixed bottom-0 right-0 p-3" style="position: absolute; top: 0; right: 0;">
                <div id="toast-rec" class="toast hide" role="alert" aria-live="assertive" aria-atomic="true" data-delay="3000" style="width: 300px;">
                    <div class="toast-header">
                        <strong class="mr-auto">Inventario_ti</strong>
                        <small class="text-muted">Ahora</small>
                        <button type="button" class="ml-2 mb-1 close" data-dismiss="toast" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="toast-body">
                        Usuario Registrado
                    </div>
                </div>
            </div>
        </div>

</body>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
    <script src="scripts/controller_recuperacion/controller_recuperacion.js"></script>

</html>
