<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login 3</title>

    <!-- Bootstrap 4 -->
    <link rel="stylesheet" href="libraries/bootstrap-4.6.2-dist/css/bootstrap.min.css">


</head>

<body>

    <style>
    body {
      background: #f8f9fa;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      background-color: white;
    }

    .login-card h3 {
      margin-bottom: 25px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="login-card" id="loginCard">
    <h3>Iniciar Sesión</h3>
    <form>
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" class="form-control" id="email" placeholder="Ingresa tu correo">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" class="form-control" id="password" placeholder="Contraseña">
      </div>
      <button type="button" class="btn btn-primary btn-block" id="loginBtn">Entrar</button>
    </form>
  </div>

</body>

<!--JQuery-->
<script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
<!--Boostrap-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"

    defer></script>
<!-- Anime.js -->
<script src="https://cdn.jsdelivr.net/npm/animejs/lib/anime.iife.min.js" defer></script>

</html>
