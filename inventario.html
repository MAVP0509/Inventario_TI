    <!--Modal registro del inventario-->
    <div class="modal fade" id="modal-registro" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">Registro</h4>
                    <button type="button" class="close" data-dismiss="modal" aria-label="close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <span id="md-reg"></span><br>
                    <label>Zona Operativa</label>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-warehouse"></i></span>
                        </div>
                        <input type="text" class="form-control" id="inp-zona" placeholder="Zona">
                    </div>
                    <label>Rubro</label>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-desktop"></i></span>
                        </div>
                        <select class="form-control select" id="inp-rubro">
                            <option></option>
                            <option value="Pc/Laptop">Pc/Laptop</option>
                            <option value="Teléfono">Teléfono</option>
                            <option value="Cámara">Cámara</option>
                            <option value="Site">Site</option>
                            <option value="Impresora">Impresora</option>
                            <option value="Salud Ocupacional">Salud Ocupacional</option>
                        </select>
                    </div>
                    <label>Activo Fijo</label>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-user-large"></i></span>
                        </div>
                        <input type="text" class="form-control" id="inp-af" placeholder="AF">
                    </div>
                    <label>Tipo de dispositivo</label>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-computer"></i></span>
                        </div>
                        <input type="text" class="form-control" id="inp-tipo" placeholder="Tipo de dispositivo">
                    </div>
                    <label>Marca del dispositivo</label>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-trademark"></i></span>
                        </div>
                        <input type="text" class="form-control" id="inp-marca" placeholder="Marca del dispositivo">
                    </div>
                    <label>Modelo del dispositivo</label>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-user-large"></i></span>
                        </div>
                        <input type="text" class="form-control" id="inp-modelo" placeholder="Modelo del dispositivo">
                    </div>
                    <label>Numero de serie</label>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-square-binary"></i></span>
                        </div>
                        <input type="text" class="form-control" id="inp-num-serie" placeholder="Numero de serie">
                    </div>
                    <label>Ubicacion del dispositivo</label>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-location-dot"></i></span>
                        </div>
                        <input type="text" class="form-control" id="inp-ubicacion" placeholder="Ubicacion del dispositivo">
                    </div>
                    <label>Etiqueta del dispositivo (TAG)</label>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-tag"></i></span>
                        </div>

                        <div class="input-group-prepend">

                        </div>

                    </div>
                    <label>Cargo del usuario</label>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-id-card"></i></span>
                        </div>
                        <input type="text" class="form-control" id="inp-posicion" placeholder="Cargo del usuario">
                    </div>
                    <label>Fecha de entrega</label>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-calendar-days"></i></span>
                        </div>
                        <input type="date" class="form-control" id="inp-fecha-entrega">
