<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="libraries/bootstrap-4.6.2-dist/css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

    <title>Inventario_TI</title>
</head>
<body class="container-fluid d-flex justify-content-center align-items-center vh-100">
    <div class="row">

        <!--Col de Iniciar sesión-->
        <div class="col" style="display: block;" id="colblock">
            <div class="card text-center" style="width: 50vh;">
                <div class="card-body">
                    <h5>Iniciar sesión</h5><br>
                    <i class="fa-solid fa-circle-user fa-5x"></i><br><br>
                    
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-sharp fa-solid fa-at"></i></span>
                        </div>
                        <input type="email" class="form-control" id="logcorreo" placeholder="Correo eléctronico" name="inputInit" input="validar_email()" required>
                    </div>

                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        </div>
                        <input type="password" class="form-control" id="logcontraseña" placeholder="Contraseña" name="inputInit">
                    </div>

                        <a clas="form-sublink" href="#" onclick="toggleForms(false, true)">¿Olvidaste tu contraseña?</a><br>
                        <br><button class="btn btn-primary" id="btn-ini" onclick="/* window.location.href='index.html' */">Iniciar sesión</button><br>
                        <br><p class="small text-center text-gray-soft">¿No te has registrado?  <a href="#" id="link-registro" onclick="toggleForms(true)">Registrate</a></p>
                        <a href="index.html">prueba</a>
                    </div>
            </div>
        </div>

        <!--Col de registro de usuario-->
        <div class="col" style="display: none;" id="colnone">
            <div class="card text-center" style="width: 50vh;">
                <div class="card-body">
                    <h5>Crear una cuenta</h5>
                    <i class="fa-solid fa-circle-user fa-5x"></i><br><br>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-user-large"></i></span>
                        </div>
                        <input type="text" class="form-control" id="nombre" placeholder="Nombre completo" name="inputReg">
                    </div>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-sharp fa-solid fa-at"></i></span>
                        </div>
                        <input type="email" class="form-control" id="regcorreo" placeholder="Correo eléctronico" name="inputReg" focus="validar_correo()" required>
                    </div>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                        </div>
                        <input type="tel" class="form-control" id="telefono" maxlength="10" required placeholder="Número de teléfono" name="inputReg" oninput="validar_telefono()">
                    </div>
                    <div class="form-row form-group">
                        <div class="col">
                            <input type="date" class="form-control" id="fechanac" placeholder="Fecha de nacimiento" name="inputReg">
                        </div>
                        <div class="col">
                            <div class="input-group mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fa-solid fa-image-portrait"></i></span>
                                </div>
                                <input type="number" class="form-control" id="edad" placeholder="Edad" name="inputReg">
                            </div>
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        </div>
                        <input type="password" class="form-control" id="reg-contraseña" data-html="true" data-toggle="popover" data-trigger="hover" title="Crea una contraseña segura" 
                        data-content="<ul class='list-group'>
                                        <li class='list-group-item' id='minlongitud'>Que tenga al menos 8 caracteres.</li>
                                        <li class='list-group-item' id='lestrasmm'>Que incluya letras mayúsculas y minúsculas.</li>
                                        <li class='list-group-item' id='numeros'>Que incluya números.</li>
                                        <li class='list-group-item' id='caracteresp'>Que incluya caracteres especiales como * () # @, etc.</li>
                                    </ul>"
                        placeholder="Crea tu contraseña" required name="inputReg">
                    </div>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                        </div>
                        <input type="password" class="form-control" id="conf-contraseña" placeholder="Confirma tu contraseña" name ="inputReg" required>
                    </div>
                    <span id="error-mensaje" style="display: none; color:red;"></span>
                    <button class="btn btn-primary" id="btn-reg" onclick="registrarUsu()/* ; window.location.href='index.html' */">Registrate</button>
                    <br>
                    <a href="#" onclick="toggleForms(false)">¿Ya tienes cuenta?</a>
                     
                </div>
            </div>
        </div>

        <!--Col de recuperación de contraseña-->
        <div class="col" style="display: none;" id="colrep">
            <div class="card text-center" style="width: 50vh;">
                <div class="card-body">
                    <h5>Recupera tu cuenta</h5>
                    <i class="fa-solid fa-circle-user fa-5x"></i><br><br>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-sharp fa-solid fa-at"></i></span>
                        </div>
                        <input type="email" class="form-control" id="repcorreo" onke placeholder="Correo eléctronico" name="inputRecov">
                    </div>

                    <div class="form-group">
                        <button type="button" class="btn btn-danger" onclick="toggleForms(false)">Cancelar</button>
                        <button type="button" class="btn btn-primary">Buscar</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
<!-- Codigo del toast-->
<div aria-live="polite" aria-atomic="true" style="position: relative; min-height: 200px;">
    <div class="position-fixed bottom-0 right-0 p-3" style="position: absolute; top: 0; right: 0;">
        <div id="liveToast" class="toast hide" role="alert" aria-live="assertive" aria-atomic="true" data-delay="2000">
          <div class="toast-header">
            <strong class="mr-auto">Inventario_ti</strong>
            <small class="text-muted">Ahora</small>
            <button type="button" class="ml-2 mb-1 close" data-dismiss="toast" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="toast-body">
            Usuario Registrado
          </div>
        </div>
    </div>
</div>
        

    
</body>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
    <script src="scripts/controller_usuario/controller_usuario.js"></script>
    <script src="scripts/controller_login/controller_login.js"></script>
    <script src="https://kit.fontawesome.com/549592f61e.js" crossorigin="anonymous"></script>

</html>
