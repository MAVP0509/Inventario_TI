<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="libraries/bootstrap-4.6.2-dist/css/bootstrap-grid.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
        <link rel="stylesheet" href="libraries/fontawesome-free-6.7.2-web/css/all.min.css">

        <title>Inventario_TI</title>
    </head>
    <body class="container-fluid d-flex justify-content-center align-items-center vh-100">
            <div class="row">
                <!--Col de Iniciar sesión-->
                <div class="col" style="display: block;" id="colblock">
                    <div class="card text-center" style="width: 50vh;">
                        <div class="card-body">
                            <h5>Iniciar sesión</h5><br>
                            <!--Logotipo del usuario-->
                            <i class="fa-solid fa-circle-user fa-5x"></i><br><br>
                            <!--Input del correo-->
                            <div class="input-group mb-3">
                                <div class="input-group-prepend">
                                    <!--icono del input-->
                                    <span class="input-group-text"><i class="fa-sharp fa-solid fa-at"></i></span>
                                </div>
                                <input type="email" class="form-control Comprobarmail" id="logcorreo" placeholder="Correo eléctronico" name="inputInit" input="validar_email()">
                            </div>
                            <span id="error-mensajeEmail-log" style="display: none; color:red;">Ingresa un correo válido</span>
                            <!--input de la contraseña-->
                            <div class="input-group mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text verContraseña"><i id="toggle-password-icon-log" class="fa-solid fa-eye-slash" style="cursor: pointer;"></i></span>
                                </div>
                                <input type="password" class="form-control" id="logcontraseña" placeholder="Contraseña" name="inputInit">
                            </div>

                                <a clas="form-sublink" href="#" onclick="toggleForms(false, true)">¿Olvidaste tu contraseña?</a><br>
                                <br><button class="btn btn-primary" id="btn-ini" onclick="validar_ingreso()">Iniciar sesión</button><br>
                                <br><p class="small text-center text-gray-soft">¿No te has registrado?  <a href="#" id="link-registro" onclick="toggleForms(true)">Registrate</a></p>
                            </div>
                    </div>
                </div>

                <!--Col de registro de usuario-->
                <div class="col" style="display: none;" id="colnone">
                    <div class="card text-center" style="width: 50vh;">
                        <div class="card-body">
                            <h5>Crear una cuenta</h5>
                            <i class="fa-solid fa-circle-user fa-5x"></i><br><br>
                            <div class="input-group mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fa-solid fa-user-large"></i></span>
                                </div>
                                <input type="text" class="form-control" id="nombre" placeholder="Nombre completo" name="inputReg" required>
                            </div>
                            <span id="error-mensajeNombre" style="display: none; color:red;">Ingresa un nombre válido</span>
                            <div class="input-group mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fa-sharp fa-solid fa-at"></i></span>
                                </div>
                                <input type="email" class="form-control Comprobarmail" id="regcorreo" placeholder="Correo eléctronico" name="inputReg"  required>
                            </div>
                            <span id="error-mensajeEmail-reg" style="display: none; color:red;">Ingresa un correo válido</span>
                            <div class="input-group mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                                </div>
                                <input type="tel" class="form-control" id="telefono" maxlength="10" placeholder="Número de teléfono" name="inputReg">
                            </div>
                            <span id="error-mensageTel" style="display: none; color:red;">Ingresa un número válido</span>
                            <div class="form-row form-group">
                                <div class="col">
                                    <input type="date" class="form-control" id="fechanac" placeholder="Fecha de nacimiento" name="inputReg">
                                </div>
                                <div class="col">
                                    <div class="input-group mb-3">
                                        <div class="input-group-prepend">
                                            <span class="input-group-text"><i class="fa-solid fa-image-portrait"></i></span>
                                        </div>
                                        <input type="number" class="form-control" id="edad" placeholder="Edad" name="inputReg" disabled>
                                    </div>
                                </div>
                            </div>
                            <span id="error-mensageFecha" style="display: none; color:red;">Ingresa una fecha válida</span>
                            <div class="input-group mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i id="toggle-password-icon" class="fa-solid fa-eye-slash" style="cursor: pointer;"></i></span>
                                </div>
                                <input type="password" class="form-control ComprobarContraseña" id="reg-contraseña" data-html="true" data-toggle="popover" data-trigger="hover" title="Crea una contraseña segura" 
                                data-content="<ul class='list-group'>
                                                <li class='list-group-item' id='minlongitud'>Que tenga al menos 8 caracteres.</li>
                                                <li class='list-group-item' id='lestrasmm'>Que incluya letras mayúsculas y minúsculas.</li>
                                                <li class='list-group-item' id='numeros'>Que incluya números.</li>
                                                <li class='list-group-item' id='caracteresp'>Que incluya caracteres especiales como * () # @, etc.</li>
                                            </ul>"
                                placeholder="Crea tu contraseña" required name="inputReg">
                            </div>
                            <div class="input-group mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                                </div>
                                <input type="password" class="form-control ComprobarContraseña" id="conf-contraseña" placeholder="Confirma tu contraseña" name ="inputReg" required>
                            </div>
                            <div id="error-mensaje" style="display: none; color:red;"></div>
                            <button class="btn btn-primary" id="btn-reg" onclick="registrarUsu()" >Registrate</button>
                            <br>
                            <a href="#" onclick="toggleForms(false)">¿Ya tienes cuenta?</a>
                            
                        </div>
                    </div>
                </div>

                <!--Col de recuperación de contraseña-->
                <div class="col" style="display: none;" id="colrep">
                    <div class="card text-center" style="width: 50vh;">
                        <div class="card-body">
                            <h5>Recupera tu cuenta</h5>
                            <i class="fa-solid fa-circle-user fa-5x"></i><br><br>
                            <div class="input-group mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fa-sharp fa-solid fa-at"></i></span>
                                </div>
                                <input type="email" class="form-control Comprobarmail" id="repcorreo" placeholder="Correo eléctronico" required>
                            </div>
                            <span id="error-mensajeEmail-rep" style="display: none; color:red;">Ingresa un correo válido</span>
                            <div class="form-group">
                                <button type="button" class="btn btn-danger" onclick="toggleForms(false)">Cancelar</button>
                                <button type="button" class="btn btn-primary" onclick="recuperar_contraseña()">Buscar</button>
                            </div>
                                <div class="alert alert-success" role="alert" id="mensaje-correo-success" style="display: none;"></div>
                                <div class="alert alert-danger" role="alert" id="mensaje-correo-danger" style="display: none;"></div>                                
                        </div>
                    </div>
                </div>

                <!--Col de reseteo de contraseña-->
                <!--div class="col" style="display: none;" id="col-reset">
                    <div class="card text-center" style="width: 50vh;" id="form-resetPass" >
                        <div class="card-body">
                            <h5>Resestablece tu contraseña</h5>
                            <i class="fa-solid fa-user-secret fa-5x"></i><br><br>
                            <div class="input-group mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                </div>
                                <input type="password" class="form-control" id="respass" placeholder="Nueva contraseña" name="inputReset">
                            </div>
                            <div class="input-group mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                                </div>
                                <input type="password" class="form-control" id="conf-respass" placeholder="Confirmar contraseña" name="inputReset">
                            </div>
                            <div class="form-group">
                                <button type="button" class="btn btn-primary" onclick="confirmarReset()">Confirmar</button>
                            </div>
                        </div>
                    </div>        

                </div-->
            </div><!--Termina la "row"-->
        
</body>
