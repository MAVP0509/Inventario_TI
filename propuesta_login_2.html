<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">


    <!-- jQuery (requerido para el script de cambio de formulario) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.transit/0.9.12/jquery.transit.min.js"></script>


    <style>
        @import url('https://fonts.googleapis.com/css?family=Montserrat:400,600,700|Work+Sans:300,400,700,900');

        * {
            outline-width: 0;
            font-family: 'Montserrat' !important;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-image: url(fondo_login_propuesta_1.png);
        }

        #container {
            height: 100vh;
            background-size: cover !important;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            /* overflow: hidden; */
        }

        #inviteContainer {
            display: flex;
            overflow: hidden;
            position: relative;
            border-radius: 20px;
            background-color: rgba(40,43,48,.75);;
            /* background-image: url(img_propuesta_login_1_2.jpg); */
            background-size: cover;
            background-position: center;
        }

        .acceptContainer {
            padding: 45px 30px;
            box-sizing: border-box;
            width: 400px;
            margin-left: -400px;
            overflow: hidden;
            height: 0;
            opacity: 0;
            position: relative;
        }

        .acceptContainer.loadIn {
            opacity: 1;
            margin-left: 0;
            transition: 0.5s ease;
        }

        .acceptContainer::before {
            content: "";
            background-size: cover !important;
            box-shadow: inset 0 0 0 3000px rgba(92, 97, 109, 0.55);
            filter: blur(10px);
            position: absolute;
            width: 150%;
            height: 150%;
            top: -50px;
            left: -50px;
        }

        form {
            position: relative;
            text-align: center;
            height: 100%;
        }

        form h1 {
            margin: 0 0 15px 0;
            font-family: 'Work Sans' !important;
            font-weight: 700;
            font-size: 20px;
            color: #fff;
            user-select: none;
            opacity: 0;
            left: -30px;
            position: relative;
            transition: 0.5s ease;
        }

        form h1.loadIn {
            left: 0;
            opacity: 1;
        }

        .formContainer {
            text-align: left;
        }

        .formDiv {
            margin-bottom: 30px;
            left: -25px;
            opacity: 0;
            transition: 0.5s ease;
            position: relative;
        }

        .formDiv.loadIn {
            opacity: 1;
            left: 0;
        }

        .formDiv:last-child {
            padding-top: 10px;
            margin-bottom: 0;
        }

        .formContainer p {
            margin: 0;
            font-weight: 700;
            color: #aaa;
            font-size: 15px;
            user-select: none;
        }

        input[type="password"],
        input[type="email"] {
            background: transparent;
            border: none;
            box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.15);
            padding: 15px 0;
            box-sizing: border-box;
            color: #fff;
            width: 100%;
        }

        input[type="password"]:focus,
        input[type="email"]:focus {
            box-shadow: inset 0 -2px 0 #fff;
        }

        .logoContainer {
            padding: 45px 35px;
            box-sizing: border-box;
            position: relative;
            z-index: 2;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transform: scale(0, 0);
        }

        .logoContainer img {
            width: 150px;
            margin-bottom: -5px;
            display: block;
            position: relative;
        }

        .logoContainer img:first-child {
            width: 150px;
        }

        .logoContainer .text {
            padding: 25px 0 10px 0;
            margin-top: -70px;
            opacity: 0;
        }

        .logoContainer .text.loadIn {
            margin-top: 0;
            opacity: 1;
            transition: 0.8s ease;
        }

        .logoContainer .logo {
            position: relative;
            top: -20px;
            opacity: 0;
        }

        .logoContainer .logo.loadIn {
            top: 0;
            opacity: 1;
            transition: 0.8s ease;
        }

        .logoContainer::before {
            content: "";
            background-size: cover !important;
            position: absolute;
            top: -50px;
            left: -50px;
            width: 150%;
            height: 150%;
            filter: blur(10px);
            box-shadow: inset 0 0 0 3000px rgba(255, 255, 255, 1);
        }

        .forgotPas {
            color: #aaa;
            opacity: .8;
            text-decoration: none;
            font-weight: 700;
            font-size: 11px;
            margin-top: 15px;
            display: block;
            transition: 0.2s ease;
        }

        .forgotPas:hover {
            opacity: 1;
            color: #fff;
        }

        .acceptBtn {
            width: 100%;
            box-sizing: border-box;
            background: #3E7CB1;
            border: none;
            color: #fff;
            padding: 20px 0;
            border-radius: 3px;
            cursor: pointer;
            transition: 0.2s ease;
            user-select: none;
            font-size: 18px;
        }

        .acceptBtn:hover {
            background: #0D3D7D;
        }

        .register {
            color: #aaa;
            font-size: 12px;
            padding-top: 15px;
            display: block;
        }

        .register a {
            color: #fff;
            text-decoration: none;
            margin-left: 5px;
            box-shadow: inset 0 -2px 0 transparent;
            padding-bottom: 5px;
            user-select: none;
        }

        .register a:hover {
            box-shadow: inset 0 -2px 0 #fff;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="inviteContainer">
            <div class="logoContainer">
                <img class="logo" src="images/diavaz_logo.png">
                <!-- <div class="text">Tu texto aquí debajo del logo</div> -->
            </div>
            <div class="acceptContainer">
                <form>
                    <h1>¡Bienvenido!</h1>
                    <div class="formContainer">
                        <div class="formDiv" style="transition-delay: 0.2s">
                            <p>Correo</p>
                            <input type="email" required />
                        </div>
                        <div class="formDiv" style="transition-delay: 0.4s">
                            <p>Contraseña</p>
                            <input type="password" required />
                            <a class="forgotPas" href="#">¿Olvidaste tu contraseña?</a>
                        </div>
                        <div class="formDiv" style="transition-delay: 0.6s">
                            <button class="acceptBtn" type="submit">Iniciar sesión</button>
                            <span class="register">
                                Diavaz servicios de producción terrestres Telemetría 
                            </span>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        // JQUERY
        $(function () {

            $('#container').append('<style>#container, .acceptContainer:before, #logoContainer:before {background: url("img_propuesta_login_1") center fixed }');




            setTimeout(function () {
                $('.logoContainer').transition({ scale: 1 }, 700, 'ease');
                setTimeout(function () {
                    $('.logoContainer .logo').addClass('loadIn');
                    setTimeout(function () {
                        $('.logoContainer .text').addClass('loadIn');
                        setTimeout(function () {
                            $('.acceptContainer').transition({ height: '431.5px' });
                            setTimeout(function () {
                                $('.acceptContainer').addClass('loadIn');
                                setTimeout(function () {
                                    $('.formDiv, form h1').addClass('loadIn');
                                }, 500)
                            }, 500)
                        }, 500)
                    }, 500)
                }, 1000)
            }, 10)
        });
    </script>
</body>

</html>
