<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="images/x-icon" href="images/diavaz.jfif">
    <title>Inventario TI</title>

    <!-- 1. Bootstrap base -->
    <link rel="stylesheet" href="libraries/bootstrap-4.6.2-dist/css/bootstrap-grid.min.css">
    <!-- 2. Plugins basados en Bootstrap (como AdminLTE, Tempus Dominus, Select2, Tabulator) -->
    <link rel="stylesheet" href="dist/css/adminlte.min.css">
    <link rel="stylesheet" href="libraries/Tabulator/tabulator_bootstrap4.min.css">
    <link rel="stylesheet" href="libraries/fontawesome-free-6.7.2-web/css/all.min.css">
    <link rel="stylesheet" href="libraries/select2/css/select2.min.css">
    <link rel="stylesheet" href="libraries/select2/css/select2-bootstrap4.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/tempusdominus-bootstrap-4/5.39.0/css/tempusdominus-bootstrap-4.min.css"
        integrity="sha512-3JRrEUwaCkFUBLK1N8HehwQgu8e23jTH4np5NHOmQOobuC4ROQxFwFgBLTnhcnQRMs84muMh0PnnwXlPq5MGjg=="
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css">
    <!-- 3. Iconos y efectos visuales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link href="https://unpkg.com/filepond@^4/dist/filepond.css" rel="stylesheet" />
    <link href="https://unpkg.com/filepond-plugin-pdf-preview/dist/filepond-plugin-pdf-preview.css" rel="stylesheet" />

    <link href="https://cdn.jsdelivr.net/npm/smartwizard@6/dist/css/smart_wizard_all.min.css" rel="stylesheet"
        type="text/css" />

    <style>
        .fa-stack {
            font-size: 14px;
            /* tamaño pequeño, ajusta según quieras */
        }

        /* .card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        } */

        .card-header {
            border-bottom: 1.5px solid rgba(0, 123, 255, 0.5);
            /* azul primario semi-transparente */
            /* azul primario, o el color que quieras */
        }
    </style>

</head>

<body class="hold-transition sidebar-mini layout-fixed" onload="consultar_informacion()">

    <div class="wrapper">

        <!-- Preloader -->
        <div class="preloader flex-column justify-content-center align-items-center">
            <img src="images/diavaz.jfif" alt="DiavazLogo" height="60" width="60"><br>
            <img src="images/blocks-shuffle-5.svg" alt="Icono" height="60" width="60">
        </div>

        <nav class="main-header navbar navbar-expand navbar-white navbar-light fixed-top">

            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>

                </li>
            </ul>
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#" role="button" onclick="cerrar_sesionmsg()" id="log-out"><i
                            class="fa-solid fa-door-closed fa-xl"></i></a>
                </li>
            </ul>
        </nav>

        <aside class="main-sidebar sidebar-dark-primary elevation-4">
            <a href="#" class="brand-link">
                <img src="images/diavaz.png" alt="Logo" class="brand-image img-circle elevation-3" style="opacity: .8">
                <span class="brand-text font-weight-light">Inventario TI</span>
            </a>
            <div id="sidebar-container"></div>
        </aside>

        <!--Contenedor Wrapper. Contenidos de la pagina-->
        <div class="content-wrapper">
            <!--Contenedor Header-->
            <div class="content-header">
                <div class="container fluid">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1 class="m-0">Tabla Inventario TI</h1>
                        </div>

                    </div>
                </div>
            </div>

            <section class="content">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col">
                            <div class="card card-outline card-lightblue">
                                <!--Card header-->
                                <div class="card-header">
                                    <h1 class="card-title" style="font-size: 23px;">
                                        <span class="fa-stack fa-2x">
                                            <i class="fa-regular fa-file fa-stack-2x"></i> <!-- fondo, tamaño doble -->
                                            <i class="fa-solid fa-screwdriver-wrench fa-stack-1x"></i>
                                            <!-- ícono arriba, tamaño normal -->
                                        </span>
                                        Mantenimientos
                                    </h1>
                                    <div class="d-flex justify-content-end">

                                        <button type="button" style="text-align: center" data-toggle="popover"
                                            data-trigger="hover" data-html="true" data-placement="bottom"
                                            data-content="Baja de activo" class="btn bg-gray-dark rounded icon mr-3"
                                            onclick="mdl_programar_mantenimiento()"><i class="fa-solid fa-file-invoice"></i> Programar Mantenimiento
                                        </button>
                                    </div>
                                </div>
                                <!--Card Body-->
                                <div class="card-body">
                                    <div id="tbl01"></div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

            </section> <!--Container-->
        </div>

    </div>




    <!--Modal programar mantenimiento -->
    <div class="modal fade" tabindex="-1" aria-hidden="false" id="mdl-prog-mant" role="dialog" data-backdrop="static"
        data-keyboard="false">
        <div class="modal-dialog ">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Programar mantenimiento</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="container-fluid">
                        <div class="row">
                            <div class="col">
                                <h6>Elaboró</h6>
                                <div class="input-group mb-3">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text"><i class="fa-solid fa-user-large"></i></span>
                                    </div>
                                    <select class="form-control select" id="select-elaboro" name="inp-prog-mant"></select>
                                    <div class="invalid-feedback">Por favor, seleccione una persona.</div>
                                </div>
                                <h6>Autorizó</h6>
                                <div class="input-group mb-3">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text"><i class="fa-solid fa-user-large"></i></span>
                                    </div>
                                    <select class="form-control select" id="select-autorizo" name="inp-prog-mant"></select>
                                    <div class="invalid-feedback">Por favor, seleccione una persona.</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger icon" data-dismiss="modal" id="mdl-btn-can">Cancelar <i
                            class="fa-solid fa-arrow-right-from-bracket  fa-lg"></i></button>
                    <button type="button" class="btn btn-success icon" id="mdl-btn-conf"
                        onclick="">Confirmar <i class="fa-solid fa-circle-check fa-lg"></i></button>
                </div>
            </div>
        </div>
    </div>
</body>
