<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario TI</title>

    <link rel="stylesheet" href="libraries/bootstrap-4.6.2-dist/css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="dist/css/adminlte.min.css">
    <link rel="stylesheet" href="libraries/fontawesome-free-6.7.2-web/css/all.min.css">
    <link rel="stylesheet" href="libraries/Tabulator/tabulator_bootstrap4.min.css">
    <link rel="stylesheet" href="libraries/select2/css/select2-bootstrap4.min.css">
    <link rel="stylesheet" href="libraries/select2/css/select2.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
</head>

<body class="hold-transition sidebar-mini layout-fixed" onload="consultar_informacion()">
    <div class="wrapper">

        <!-- Preloader -->
        <div class="preloader flex-column justify-content-center align-items-center">
            <img src="diavaz.png" alt="DiavazLogo" height="60" width="60">
        </div>

        <nav class="main-header navbar navbar-expand navbar-white navbar-light fixed-top">

            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>

                </li>
            </ul>
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#" role="button" onclick="cerrar_sesionmsg()" id="log-out"><i
                            class="fa-solid fa-door-closed fa-xl"></i></a>
                </li>

            </ul>

        </nav>

        <aside class="main-sidebar sidebar-dark-primary elevation-4">
            <a href="#" class="brand-link">
                <img src="diavaz.png" alt="Logo" class="brand-image img-circle elevation-3" style="opacity: .8">
                <span class="brand-text font-weight-light">Inventario TI</span>
            </a>

            <div id="sidebar-container"></div>
        </aside>


        <!--Contenedor Wrapper. Contenidos de la pagina-->
        <div class="content-wrapper">
            <!--Contenedor Header-->
            <div class="content-header">
                <div class="container fluid">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1 class="m-0">Inventario TI</h1>
                        </div>

                    </div>
                </div>
            </div>

            <section class="content">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-12">
                            <div class="card">
                                <!--Card header-->
                                <div class="card-header">
                                    <h3 class="card-title"><i class="fa-solid fa-table"></i> Supervisores</h3>
                                    <div class="d-flex justify-content-end mb-3">
                                        <button type="button" class="btn btn-success mr-3 icon"
                                            onclick="nuevo_supervisor()"><i class="fa-solid fa-plus fa-lg"></i>
                                            Nuevo</button>
                                        <button type="button" class="btn btn-danger mr-3 icon" onclick="mensaje_eliminar()"><i class="fa-solid fa-trash-can fa-lg"></i> Eliminar</button>
                                    </div>
                                </div>
                                <!--Card Body-->
                                <div class="card-body">
                                    <div id="tbl" class="table  table-striped table-bordered table-sm"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section> <!--Container-->

        </div>
    </div>

    <!-- Modal Editar-->
    <div class="modal fade" id="modalEditar" style="display : none;" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">Editar</h4>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <label for="edi-nombre" style="display: block;">Nombre</label>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-user-large"></i></span>
                        </div>
                        <select class="form-control select" id="edi-nombre"></select>
                        <div class="invalid-feedback">Por favor, seleccione un nombre.</div>
                    </div>
                    <label for="edi-cargo">Cargo</label>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-briefcase"></i></span>
                        </div>
                        <select class="form-control select" id="edi-cargo"></select>
                        <div class="invalid-feedback">Por favor, seleccione un cargo.</div>
                    </div>
                    <label for="edi-region" class="form-label">Región</label>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-map-location-dot"></i></span>
                        </div>
                        <select class="form-control select" id="edi-region"></select>
                        <div class="invalid-feedback">Por favor, seleccione una región.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger icon" data-dismiss="modal">Cancelar <i
                            class="fa-solid fa-arrow-right-from-bracket  fa-lg"></i></button>
                    <button type="button" class="btn btn-success icon" onclick="editar_supervisor()">Guardar <i
                            class="fa-solid fa-floppy-disk fa-lg"></i></button>
                </div>
            </div>
        </div>
    </div>


    <!-- Modal nuevo supervisor-->
    <div class="modal fade" id="modalInsertar" style="display : none;" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">Nuevo Supervisor</h4>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <label for="inp-nombre" style="display: block;">Nombre</label>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-user-large"></i></span>
                        </div>
                        <select class="form-control select" id="inp-nombre"></select>
                        <div class="invalid-feedback">Por favor, seleccione un nombre.</div>
                    </div>
                    <label for="inp-cargo">Cargo</label>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-briefcase"></i></span>
                        </div>
                        <select class="form-control select" id="inp-cargo"></select>
                        <div class="invalid-feedback">Por favor, seleccione un cargo.</div>
                    </div>
                    <label for="inp-region" class="form-label">Región</label>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-map-location-dot"></i></span>
                        </div>
                        <select class="form-control select" id="inp-region"></select>
                        <div class="invalid-feedback">Por favor, seleccione una región.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger icon" data-dismiss="modal">Cancelar <i
                            class="fa-solid fa-arrow-right-from-bracket  fa-lg"></i></button>
                    <button type="button" class="btn btn-success icon" onclick="insertar_supervisor()">Guardar <i
                            class="fa-solid fa-floppy-disk fa-lg"></i></button>
                </div>
            </div>
        </div>
    </div>
</body>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
    integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
    crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
    integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+"
    crossorigin="anonymous"></script>
<script src="scripts/controller_acceso/controller_acceso.js"></script>
<script src="scripts/controller_supervisores/controller_supervisores.js"></script>
<script src="dist/js/adminlte.min.js"></script>
<!-- <script src="libraries/DataTables/datatables.min.js"></script> -->
<script src="libraries/Tabulator/tabulator.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="libraries/select2/js/select2.min.js"></script>

</html>
