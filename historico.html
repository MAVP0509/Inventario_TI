<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="images/x-icon" href="images/diavaz.jfif">

  <!--Bootstrap-->
  <link rel="stylesheet" href="libraries/bootstrap-4.6.2-dist/css/bootstrap-grid.min.css">

  <!--Admin LTE-->
  <link rel="stylesheet" href="dist/css/adminlte.min.css">

  <!--FontAwesome-->
  <link rel="stylesheet" href="libraries/fontawesome-free-6.7.2-web/css/all.min.css">

  <!--Tabulator-->
  <link rel="stylesheet" href="libraries/Tabulator/tabulator_bootstrap4.min.css">

  <title>Inventario TI</title>

  <script>
    window.addEventListener('load', function () {
      let usuario = JSON.parse(sessionStorage.getItem('user'))
      let rol = usuario.resultado[3]
      if (!(rol === 'admin')) {
        window.location.href = 'inventario'
      }
    })
  </script>
</head>

<body class="hold-transition sidebar-mini layout-fixed" onload="consultar_historico()">

  <div class="wrapper">
    <!-- Preloader -->
    <div class="preloader flex-column justify-content-center align-items-center">
      <img src="images/diavaz.jfif" alt="DiavazLogo" height="60" width="60"><br>
      <img src="images/blocks-shuffle-5.svg" alt="Icono" height="60" width="60">
    </div>
    <nav class="main-header navbar navbar-expand navbar-white navbar-light fixed-top">
      <!-- Left navbar links -->
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
        </li>
      </ul>
      <ul class="navbar-nav ml-auto">
        <!--Notificaciones-->
        <li class="nav-item dropdown">
          <a class="nav-link" data-toggle="dropdown" href="#" aria-expanded="false"><i
              class="fa-solid fa-bell"></i><span class="badge badge-danger navbar-badge"
              name="aviso-badge-campana"></span></a>
          <div class="dropdown-menu dropdown-menu-lg dropdown-menu-right" name="aviso-campana-notificacion"
            style="left: inherit; right: 0px;">
            <span class="dropdown-item dropdown-header" name="header-campana-notificacion">Sin Notificaciones</span>
            <div class="dropdown-divider" name="header-divider-campana-notificacion"></div>
          </div>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" role="button" onclick="cerrar_sesionmsg()" id="log-out"><i
              class="fa-solid fa-door-closed fa-xl"></i></a>
        </li>
      </ul>
    </nav>

    <aside class="main-sidebar sidebar-dark-primary elevation-4">
      <a href="#" class="brand-link">
        <img src="images/diavaz.png" alt="Logo" class="brand-image img-circle elevation-3" style="opacity: .8">
        <span class="brand-text font-weight-light">Inventario TI</span>
      </a>

      <div id="sidebar-container"></div>
    </aside>

    <div class="content-wrapper">
      <!-- Content Header (Page header) -->
      <div class="content-header">
        <div class="container-fluid">
          <div class="row mb-2">
            <div class="col-sm-6">
              <h1 class="m-0">Inventario TI</h1>
            </div><!-- /.col -->
          </div><!-- /.row -->
        </div><!-- /.container-fluid -->
      </div>
      <!-- /.content-header -->

      <!-- Main content -->
      <section class="content">
        <div class="container-fluid">
          <!-- Small boxes (Stat box) -->
          <div class="row">
            <div class="col-12">
              <div class="card">
                <div class="card-header">
                  <h3 class="card-title" style="font-size: 23px;">
                    <i class="fa-solid fa-table"></i>
                    Historial
                  </h3>
                  <div class="d-flex justify-content-end mb-3"></div>
                </div><!-- /.card-header -->

                <div class="card-body">
                  <input class="form-control" id="buscador-tabla-historico" type="text"
                    placeholder="Buscar por serie, IMEI, evento, usuario, fecha, ubicación...">
                  <br>
                  <div id="tbl02"></div>
                </div><!-- /.card-body -->
              </div>
            </div>

            <!-- ./col -->
          </div>
          <!-- /.row -->
          <!-- Main row -->

          <!-- /.row (main row) -->
        </div><!-- /.container-fluid -->
      </section>
      <!-- /.content -->
    </div>
  </div>

</body>
