<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="libraries/bootstrap-4.6.2-dist/css/bootstrap-grid.min.css">
  <link rel="stylesheet" href="dist/css/adminlte.min.css">
  <link rel="stylesheet" href="libraries/fontawesome-free-6.7.2-web/css/all.min.css">
  <link rel="stylesheet" href="libraries/Tabulator/tabulator_bootstrap4.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

  <title>Inventario TI</title>
</head>

<body class="hold-transition sidebar-mini layout-fixed" onload="consultar_informacion()">

  <div class="wrapper">
    <!-- Preloader -->
    <div class="preloader flex-column justify-content-center align-items-center">
      <img src="diavaz.png" alt="DiavazLogo" height="60" width="60">
    </div>
    <nav class="main-header navbar navbar-expand navbar-white navbar-light fixed-top">
      <!-- Left navbar links -->
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
        </li>
      </ul>
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <a class="nav-link" href="#" role="button" onclick="cerrar_sesionmsg()" id="log-out"><i
              class="fa-solid fa-door-closed fa-xl"></i></a>
        </li>

      </ul>


    </nav>

    <aside class="main-sidebar sidebar-dark-primary elevation-4">
      <a href="#" class="brand-link">
        <img src="diavaz.png" alt="Logo" class="brand-image img-circle elevation-3" style="opacity: .8">
        <span class="brand-text font-weight-light">Inventario TI</span>
      </a>

      <div id="sidebar-container"></div>
    </aside>

    <div class="content-wrapper">
      <!-- Content Header (Page header) -->
      <div class="content-header">
        <div class="container-fluid">
          <div class="row mb-2">
            <div class="col-sm-6">
              <h1 class="m-0">Inventario TI</h1>
            </div><!-- /.col -->
          </div><!-- /.row -->
        </div><!-- /.container-fluid -->
      </div>
      <!-- /.content-header -->

      <!-- Main content -->
      <section class="content">
        <div class="container-fluid">
          <!-- Small boxes (Stat box) -->
          <div class="row">
            <div class="col-12">
              <div class="card">
                <div class="card-header">
                  <h3 class="card-title">
                    <i class="fa-solid fa-table"></i>
                    Tipos
                  </h3>
                  <div class="d-flex justify-content-end">
                    <button type="button" class="btn btn-success mr-3 icon" onclick="mdl_nuevo_tipo()"><i
                        class="fa-solid fa-plus fa-lg"></i> Nuevo</button>
                    <button type="button" class="btn btn-danger mr-3 icon" onclick="mensaje_eliminar()"><i
                        class="fa-solid fa-trash-can fa-lg"></i> Eliminar</button>
                  </div>
                </div><!-- /.card-header -->

                <div class="card-body">
                  <div id="tbl" class="table  table-striped table-bordered table-sm"></div>
                </div><!-- /.card-body -->
              </div>
            </div>

            <!-- ./col -->
          </div>
          <!-- /.row -->
          <!-- Main row -->

          <!-- /.row (main row) -->
        </div><!-- /.container-fluid -->
      </section>
      <!-- /.content -->
    </div>
  </div>

  <!--Modal tipo -->
  <div class="modal fade" tabindex="-1" aria-hidden="true" id="mdl-tipo">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="mdl-title">title</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="input-group mb-3">
            <div class="input-group-prepend">
              <span class="input-group-text"><i class="fa-solid fa-desktop"></i></span>
            </div>
            <input type="text" class="form-control" id="tipo" autocomplete="off">
            <div class="invalid-feedback" id="tipo-feedback">Por favor, ingrese un tipo.</div>
          </div>
          <div class="alert alert-danger position-relative d-flex align-items-start " role="alert"
            style="display:none !important; background-color:#fceaea; border-color:#f5c6cb; color:#721c24; padding-right: 4rem;"
            id="alert-edit-tipo">
            <button type='button' class='btn icon toggle-select me-2' id="check-editar">
              <i class='fa-regular fa-square fa-lg' id="check-editar-icon"></i>
            </button>
            Estos cambios afectarán cada registro del inventario que tenga este tipo asignado.
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger icon" data-dismiss="modal" id="mdl-btn-can">Cancelar <i
              class="fa-solid fa-arrow-right-from-bracket  fa-lg"></i></button>
          <button type="button" class="btn btn-success icon" id="mdl-btn-conf" onclick="">Confirmar <i
              class="fa-solid fa-circle-check fa-lg"></i></button>
        </div>
      </div>
    </div>
  </div>

</body>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
  integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
  integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
<script src="dist/js/adminlte.min.js"></script>
<script src="scripts/controller_acceso/controller_acceso.js"></script>
<script src="scripts/controller_conf_tipo/controller_conf_tipo.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="libraries/Tabulator/tabulator.min.js"></script>

</html>
